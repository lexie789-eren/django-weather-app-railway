<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      
        .top {
         background-color: antiquewhite;
         text-align: center;
         padding: 20px;       /* space inside the bar instead */
         }

        .top h1 {
         margin: 0;           /* removes the h1 gap */
        }    

        body {
        font-family: Arial, sans-serif;
        background-color: #eef3f8;
        margin: 0;
        padding: 0;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(200px, 1fr));
        gap: 20px;
        margin: 40px 20px;
    }

    .grid div {
        background-color: white;
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        
    }

    .grid h1 {
        font-size: 24px;
        margin: 10px 0;
    }

    .grid h3 {
        font-size: 32px;
        margin: 10px 0;
        color: #e67e22;
    }

    .grid p {
        color: #555;
        text-transform: capitalize;
        margin: 0;
    }
        .form{
           display: flex;
           justify-content: center;
           margin-top: 20px;
        }

        .form input{
            padding: 15px;
            
        }
        .form button{
            padding: 10px;
            background-color: beige;
        }

    </style>
</head>


<body>
    <div class="top">
        <h1>Weather App</h1>
    </div>

    <div class="hero">
        {% block hero %}{% endblock hero %}
    </div>
</body>
</html>
