<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      
        body {
    font-family: Arial, sans-serif;
    background-color: #eef3f8;
    margin: 0;
    padding: 0;
}

.top {
    background-color: antiquewhite;
    text-align: center;
    padding: 20px;
}

.top h1 {
    margin: 0;
}

/* ---------- Form ---------- */
.form {
    display: flex;
    justify-content: center;
    margin-top: 20px;
    padding: 0 20px;
}

.form form {
    display: flex;
    width: 100%;
    max-width: 500px;
}

.form input {
    flex: 1;              /* input takes the remaining space */
    padding: 15px;
    font-size: 16px;
    min-width: 0;
}

.form button {
    padding: 15px 20px;
    background-color: rgb(6, 74, 3);
    color: white;
    font-weight: bold;
    border: none;
    cursor: pointer;
}

/* ---------- Grid (default = 4 columns for large screens) ---------- */
.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin: 40px 20px;
}

.grid div {
    background-color: white;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
}

.grid h1 {
    font-size: 24px;
    margin: 10px 0;
}

.grid h3 {
    font-size: 32px;
    margin: 10px 0;
    color: #e67e22;
}

.grid p {
    color: #555;
    text-transform: capitalize;
    margin: 0;
}

/* ---------- Tablet: 2 columns ---------- */
@media (max-width: 992px) {
    .grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

/* ---------- Phone: 1 column ---------- */
@media (max-width: 576px) {
    .grid {
        grid-template-columns: 1fr;
        margin: 20px 15px;
    }

    .top h1 {
        font-size: 24px;
    }

    .form form {
        flex-direction: column;   /* input on top, button below */
    }

    .form button {
        margin-top: 10px;
    }
}
    </style>
</head>


<body>
    <div class="top">
        <h1>Weather App</h1>
    </div>

    <div class="hero">
        {% block hero %}{% endblock hero %}
    </div>
</body>
</html>
